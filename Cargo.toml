[workspace]
resolver = "2"
members = [
    "crates/terra-core",
    "crates/terra-history",
    "crates/terra-studio",
    "fuzz",
    "bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Terra contributors"]
repository = "https://github.com/BViganotti/terra"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
